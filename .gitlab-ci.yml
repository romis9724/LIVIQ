# LIVIQ GitLab CI/CD — WSL Docker 1호스트 배포 (ADR-0020 형상 그대로, 3프로필 단일 호스트)
#
#   main push  → 이미지 4종 빌드 → 기동 → 스모크 → 레지스트리 게시
#   MR         → 빌드까지만(기동 없음) — Dockerfile·lock·compose 가 깨졌는지 머지 전에 잡는다
#   수동       → rollback(IMAGE_TAG 지정) · prune
#
# ── 이미지가 어디로 가는가 (두 경로, 목적이 다르다) ─────────────────
#   ① 배포: build 가 만든 **로컬 이미지**를 그대로 기동한다. Runner 가 배포 대상 호스트 안에서
#      돌기 때문에 push→pull 왕복(4종 약 1.3GB)이 순수 낭비다.
#   ② 게시: 스모크를 통과한 뒤 **사내 Nexus**(`REGISTRY_IMAGE`)로 push 한다. GitLab 컨테이너
#      레지스트리는 포트가 노출돼 있지 않아 쓸 수 없다(ADR-0021). 이력·백업·타 호스트
#      배포 경로용이다. **배포가 이걸 기다리지 않는다** — 게시가 실패해도 이미 기동된 배포는
#      영향받지 않는다(순서상 배포·검증이 먼저 끝나 있다).
#   순서가 이런 이유: 레지스트리에는 검증을 통과한 이미지만 올린다.
#
# ── 이 파이프라인이 배포까지 하는 근거 ──────────────────────────────
# docs/12 런북 전제 1은 "CI는 이미지만 만든다"이고, 그 이유는 **배포 자격증명을 CI에 두지 않는다**다.
# 이 경로에는 그 자격증명이 존재하지 않는다:
#   · Runner 가 shell executor 로 **배포 대상 호스트(WSL) 안에서** 돈다 → SSH 키 불필요
#   · 이미지를 같은 호스트의 Docker 이미지 저장소에 빌드한다 → 레지스트리 로그인·push 불필요
# 즉 전제의 취지를 위반하지 않는다. 대신 이 경로는 **개발·검증 호스트 전용**이다 —
# 운영 3-tier VM 배포는 GHCR + docs/12 수동 절차가 그대로 단일 출처다.
#
# ── 러너 전제 (호스트 1회 준비) ─────────────────────────────────────
#   · gitlab-runner 가 docker 그룹에 속해야 한다:  sudo usermod -aG docker gitlab-runner
#   · executor = shell / shell = bash
#   · env 파일이 레포 밖에 있어야 한다(docs/06 §7):
#       sudo install -m 0640 -o root -g gitlab-runner infra/env.prod.example /etc/liviq/env.prod
#   준비 절차 전체는 docs/13-gitlab-wsl-deploy.md.

stages:
  - build
  - deploy
  - verify
  - publish

variables:
  # 얕은 클론. shell executor 는 빌드 디렉토리를 재사용(GIT_STRATEGY=fetch 기본)하므로
  # 매 파이프라인이 전량을 다시 받지 않는다.
  GIT_DEPTH: "20"
  # 배포·롤백의 유일한 핀은 커밋 sha 다(docs/12 전제 2 — `latest` 로 배포 금지).
  # CI_COMMIT_SHORT_SHA 는 8자 = deploy-wsl.sh 의 `git rev-parse --short=8` 과 같은 폭.
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
  # **구분자를 포함한다**(ADR-0021 결정 5) — compose.prod.yml 이 `${IMAGE_PREFIX:-liviq-}api` 로
  # 참조하므로 대시가 값 안에 있어야 한다. 여기서 `liviq` 로 두면 compose 는 `liviqapi` 를 찾고
  # 스크립트는 `liviq-api` 를 빌드해 서로 어긋난다(정합 시 실제로 잡은 결함).
  # 이 값은 **로컬 이미지 이름**이다. 레지스트리 좌표는 게시에서만 쓰고 CI 변수 REGISTRY_IMAGE
  # (사내 Nexus)로 온다 — GitLab 레지스트리($CI_REGISTRY_IMAGE)는 쓰지 않는다.
  IMAGE_PREFIX: "liviq-"
  # 시크릿의 단일 출처. 레포에 없고, 러너가 읽기만 한다.
  ENV_FILE: "/etc/liviq/env.prod"

default:
  tags:
    - wsl
    - docker
  # 실패가 인프라 흔들림(이미지 pull 등)일 때만 재시도한다. 스크립트 실패는 재시도하지 않는다.
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

# ── 실행 조건 (앵커로 한 곳에서만 관리 — 잡마다 복붙하면 드리프트가 난다) ──
# `web` = GitLab UI 의 "Run pipeline" 버튼 · `api` = REST 로 트리거.
# 둘은 **같은 의도**("사람이 필요할 때 돌린다")인데 GitLab 이 진입점으로만 구분한다 →
# UI 에서 돌릴 수 있는 파이프라인은 API 로도 돌 수 있어야 한다.
.on_deploy: &on_deploy
  - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  - if: '$CI_PIPELINE_SOURCE == "web"'
  - if: '$CI_PIPELINE_SOURCE == "api"'

# 빌드만 MR 에서도 돈다 — Dockerfile·lock·compose 파손을 머지 전에 잡는다.
.on_build: &on_build
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  - if: '$CI_PIPELINE_SOURCE == "web"'
  - if: '$CI_PIPELINE_SOURCE == "api"'

# ── 빌드 ────────────────────────────────────────────────────────────
# 4종을 **한 잡에서 순차로** 빌드한다. 호스트가 4코어라 병렬 빌드(특히 Next 2종)는
# 메모리·CPU를 다투어 오히려 느리고, 같은 daemon 이라 레이어 캐시는 순차에서도 공유된다.
build:
  stage: build
  timeout: 60m
  script:
    - bash infra/deploy-wsl.sh build
  rules: *on_build

# ── 기동 ────────────────────────────────────────────────────────────
deploy:
  stage: deploy
  needs: [build]
  timeout: 20m
  # 동시 배포 차단. concurrent=2 라 다른 파이프라인의 deploy 가 겹칠 수 있고,
  # 같은 compose 프로젝트(liviq-prod)를 두 잡이 동시에 만지면 상태가 꼬인다.
  resource_group: liviq-prod
  # 배포는 중간에 끊으면 안 된다(컨테이너가 반만 교체된 상태로 남는다).
  interruptible: false
  environment:
    name: wsl-docker
    url: http://resident.localhost:8080
  script:
    - bash infra/deploy-wsl.sh deploy
  # MR 에서는 기동하지 않는다(*on_deploy 에 merge_request_event 가 없다) — 빌드로 형상 검증만.
  rules: *on_deploy

# ── 스모크 ──────────────────────────────────────────────────────────
# 기동 성공(=api healthy)과 "실제로 응답한다"는 다르다. Caddy 라우팅·프록시 헤더까지
# 사람이 쓰는 경로로 확인한다. 실패하면 파이프라인이 빨개진다(자동 롤백은 하지 않는다 —
# 되돌릴지는 운영 판단이고, rollback 잡이 수동으로 준비돼 있다).
smoke:
  stage: verify
  needs: [deploy]
  timeout: 10m
  script:
    - bash infra/deploy-wsl.sh smoke
    - bash infra/deploy-wsl.sh status
  rules: *on_deploy

# ── 레지스트리 게시 ─────────────────────────────────────────────────
# 스모크 통과 후에만 돈다(needs: smoke) — 레지스트리에 검증된 이미지만 남긴다.
# 배포는 이 잡을 기다리지 않으므로, 여기서 실패해도 기동 중인 배포는 그대로다.
#
# ★ 게시 대상은 **Nexus** 다(2026-07-27 사용자 결정). GitLab 컨테이너 레지스트리를 쓰지 않는 이유:
#   이 GitLab 은 docker 컨테이너로 돌고 포트가 22→2222·80→5050·443→8443 뿐이다. **레지스트리
#   포트(5000)가 공개되지 않았다** — 그래서 :5050 으로 push 하면 웹 vhost 로 가고 /v2/ 가
#   dependency proxy 로 응답하며 realm 이 external_url(포트 없음) 기준 80 을 가리켜 실패했다.
#   컨테이너 안에서 registry 프로세스는 돌고 있으므로 포트만 공개하면 되지만, 그러려면 컨테이너
#   재생성(포트 매핑 변경)이 필요하고 이미지가 / 파티션에 쌓인다. 사내에 이미 Nexus 의 docker
#   hosted 저장소(:8082, /home 파티션)가 있어 그쪽을 쓴다. 경위는 docs/13 §8.
#
#   자격증명은 GitLab 프로젝트 CI 변수로 주입한다(REGISTRY_* — 아래 3개). 잡 토큰이 아니라
#   Nexus 계정이므로 **마스킹 필수**다. REGISTRY_IMAGE 는 비밀이 아니다.
publish:
  stage: publish
  needs: [smoke]
  # 게시 실패는 "롤백 백업이 없다"는 뜻이므로 빨개져야 한다. 초록으로 1회 확인한 뒤 제거했다.
  timeout: 30m
  script:
    # login·logout 은 스크립트가 직접 한다 — 프리플라이트가 login 보다 먼저 돌아야 진단
    # 메시지가 docker 의 중첩 에러에 가려지지 않는다. 필요한 CI 변수:
    #   REGISTRY_IMAGE    예: 192.168.10.153:8082/liviq   (비밀 아님)
    #   REGISTRY_USER     Nexus 계정 — hosted 저장소 쓰기 권한 필요
    #   REGISTRY_PASSWORD 마스킹
    - bash infra/deploy-wsl.sh publish
  rules: *on_deploy

# ── 롤백 (수동) ─────────────────────────────────────────────────────
# 파이프라인 실행 시 변수 ROLLBACK_TAG 에 되돌릴 커밋 sha(8자)를 넣고 이 잡을 돌린다.
# 그 태그의 이미지 4종이 **이 호스트에 남아 있어야** 한다 — 남은 태그는 `tags` 로 확인한다
# (prune 잡이 최근 KEEP_TAGS 개만 보존하므로 오래된 지점은 없을 수 있다).
rollback:
  stage: deploy
  when: manual
  allow_failure: true
  resource_group: liviq-prod
  interruptible: false
  timeout: 20m
  environment:
    name: wsl-docker
    url: http://resident.localhost:8080
  variables:
    IMAGE_TAG: "$ROLLBACK_TAG"
  script:
    - |
      if [ -z "${ROLLBACK_TAG:-}" ]; then
        echo "ROLLBACK_TAG 가 비어 있다. 되돌릴 커밋 sha(8자)를 파이프라인 변수로 넣고 재실행할 것."
        echo "이 호스트에 남아 있는 태그:"
        bash infra/deploy-wsl.sh tags
        exit 1
      fi
    - bash infra/deploy-wsl.sh rollback
  rules: *on_deploy

# ── 이미지 정리 (수동) ──────────────────────────────────────────────
# 배포마다 태그가 쌓여 디스크를 먹는다. 자동으로 돌리지 않는 이유: 지운 태그는 롤백 대상에서
# 사라진다 — 언제 무엇을 버릴지는 사람이 정한다.
prune:
  stage: verify
  when: manual
  allow_failure: true
  timeout: 10m
  script:
    - bash infra/deploy-wsl.sh tags
    - bash infra/deploy-wsl.sh prune
    - bash infra/deploy-wsl.sh tags
  rules: *on_deploy
