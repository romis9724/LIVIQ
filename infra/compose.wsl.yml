# LIVIQ WSL 1호스트 오버레이 — compose.prod.yml 위에 겹쳐 쓴다.
#
#   docker compose --env-file /etc/liviq/env.prod \
#     -f infra/compose.prod.yml -f infra/compose.wsl.yml \
#     --profile data --profile app --profile web up -d
#
# 왜 별 파일인가: compose.prod.yml 은 **3-tier VM 배포 형상의 단일 출처**다(ADR-0020).
# WSL 개발 호스트 사정으로 그 파일을 오염시키지 않고, 차이만 여기 모은다.
# 이 파일은 프로필·이미지를 건드리지 않는다 — 배포 형상은 그대로다.
#
# 담는 차이가 둘이다.
#
# ── ① host.docker.internal 이 WSL Docker CE 에는 없다 ──────────────
#   Docker Desktop 은 이 이름을 자동 주입하지만, WSL 안에 apt 로 넣은 Docker Engine 은
#   주입하지 않는다 → LLM·임베딩 기본값(http://host.docker.internal:11434/v1, ADR-0005)이
#   DNS 해석에 실패한다. `host-gateway` 는 compose 가 호스트 게이트웨이 IP(WSL eth0 의
#   default via — 예: 172.17.32.1)로 치환해 주는 예약값이라, IP를 env에 박지 않아도 된다.
#
# 대상은 app tier 3종뿐이다 — 컨테이너 밖 LLM 엔드포인트로 나가는 건 이 셋이다.
# web tier(Next·Caddy)와 data tier 는 호스트로 나가지 않으므로 건드리지 않는다.
#
# 주의: Ollama 가 **Windows 호스트**에서 돌 때만 닿는다. WSL 안에서 돌린다면 그 주소는
#       host.docker.internal 이 아니라 WSL eth0 IP 이므로, env 의 LLM_BASE_URL 을 바꾼다.
#       LLM 미가동이어도 api·ai-worker 는 기동한다(호출 시점에야 필요 — 스모크는 통과).

# ── ② 외부 접속을 **포트로** 받는다 (도메인 없는 파일럿) ────────────
# 3-tier 운영은 도메인 + Caddy 자동 HTTPS 로 두 사이트를 **이름**으로 가른다. 이 호스트에는
# 도메인이 없고 포트포워딩으로만 닿는다. 실제 사슬은 이렇다(사용자 확인 2026-07-27):
#
#   브라우저 → bastion 59.29.231.14:17000 → Windows 192.168.10.140:3000 (portproxy)
#           → WSL 172.17.40.17:3000 → Caddy :3000 → web-resident:3000
#   관리자는 :17001 → 140:3001 → WSL:3001.
#
# **포워딩 대상 포트가 3000/3001 로 고정돼 있다** — 그래서 Caddy 가 그 포트를 들어야 한다.
# (컨테이너 내부 web-resident:3000·web-admin:3001 과 숫자가 겹치지만 다른 네트워크 이름공간이라
#  충돌하지 않는다. 두 웹 컨테이너는 호스트 포트를 publish 하지 않는다.)
#
# 왜 포트 기반 사이트 주소인가: 브라우저가 보내는 Host 는 `59.29.231.14:17000` 이라
# `resident.localhost` 사이트에 매칭되지 않는다 → Caddy 가 응답하지 않는다(실측: TCP 는 붙고
# HTTP 는 0바이트). `:3000` 은 포트만 맞으면 Host 와 무관하게 매칭되므로 IP 접속이 성립한다.
# 기존 8080 + `*.localhost` 경로는 **그대로 남긴다** — 파이프라인 스모크가 그 경로로 검증하고,
# 도메인이 생기면 RESIDENT_SITE 만 실주소로 바꾸면 된다.
#
# ★ portproxy 함정(실측): `listenaddress=0.0.0.0` 은 **루프백까지 점유**한다. 그래서
#   `0.0.0.0:P → 127.0.0.1:P` 규칙은 자기 자신을 가리키는 루프가 되어 `Empty reply from server`
#   로 끊긴다(WSL 자동 중계가 127.0.0.1:P 에 못 붙는다 — `[::1]:P` 만 남는다). 현재 이 호스트는
#   `0.0.0.0:3000 → 172.17.40.17:3000`(WSL IP 직접)이라 동작하지만 WSL IP 가 재부팅마다 바뀐다.
#   IP 에 의존하지 않으려면 `v4tov6 … connectaddress=::1` 로 둔다(docs/13 §9.3).
#
# ★ TLS 가 없다. 세션 쿠키·비밀번호가 평문으로 흐르므로 **가상 데이터 파일럿 전용**이다
#   (사용자 결정 2026-07-26). 실제 개인정보가 들어가는 시점에 도메인 + 자동 HTTPS 로 올린다
#   (ADR-0021 재검토 신호).
name: liviq-prod

services:
  caddy:
    ports:
      # compose 는 여러 파일의 ports 를 **누적**한다 — 8080·8443 은 compose.prod.yml 것이 살아 있다.
      # 한 변수가 publish 포트와 사이트 주소를 함께 결정한다(둘이 어긋나면 Caddy 가 안 듣는다).
      - "${RESIDENT_PORT:-3000}:${RESIDENT_PORT:-3000}"
      - "${ADMIN_PORT:-3001}:${ADMIN_PORT:-3001}"
    environment:
      # 3-tier 는 이 오버레이를 쓰지 않으므로 Caddyfile 기본값(빈 문자열)이 적용된다 — 주소 1개.
      RESIDENT_ALT_SITE: ":${RESIDENT_PORT:-3000}"
      ADMIN_ALT_SITE: ":${ADMIN_PORT:-3001}"

  migrate:
    extra_hosts:
      - "host.docker.internal:host-gateway"

  api:
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ai-worker:
    extra_hosts:
      - "host.docker.internal:host-gateway"
